<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestelling bevestigd | Tech Medic Respons</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="../index.html" class="brand">
      <img src="../assets/logo.jpg" alt="Tech Medic Respons" class="brand-logo">
    </a>
    <nav class="nav-main" aria-label="Hoofdmenu">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="index.html">Webshop</a></li>
        <li><a href="../contact.html">Contact</a></li>
      </ul>
    </nav>
    <a class="cart-link" href="cart.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
      <span class="label">Winkelwagen</span> <span class="badge" data-cart-count>0</span>
    </a>
    <button class="nav-toggle" aria-label="Menu openen" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <section>
    <div class="container">
      <div class="confirmation-box" id="confirmation">Bestelling laden…</div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; 2019–2026 Tech Medic Respons</span>
      <span>Industrieweg 6B, 1566 JP Assendelft</span>
    </div>
  </div>
</footer>

<script src="../js/script.js"></script>
<script src="../js/shop.js"></script>
<script>
(async function () {
  const el = document.getElementById("confirmation");
  const orderId = new URLSearchParams(window.location.search).get("order");
  if (!orderId) { el.innerHTML = "<p>Geen bestelling gevonden.</p>"; return; }

  try {
    const res = await fetch(`/api/orders/${orderId}`);
    if (!res.ok) throw new Error();
    const order = await res.json();

    const lines = order.items.map((li) =>
      `<div class="line"><span>${li.name} × ${li.qty}</span><span>${TMRShop.formatPrice(li.priceCents * li.qty)}</span></div>`
    ).join("");

    el.innerHTML = `
      <div class="check">✓</div>
      <h1>Bedankt voor uw bestelling!</h1>
      <p style="color:var(--text-muted);margin-bottom:24px;">
        ${order.testMode ? "Dit is een testbestelling — er is geen echte betaling verwerkt." : "We hebben uw bestelling ontvangen."}
        Bestelnummer: <strong>${order.id}</strong>
      </p>
      <div class="order-summary" style="text-align:left;">
        ${lines}
        <div class="line total"><span>Totaal</span><span>${TMRShop.formatPrice(order.totalCents)}</span></div>
      </div>
      <p style="margin-top:24px;"><a href="../index.html" class="btn btn-primary">Terug naar de website</a></p>`;
  } catch (err) {
    el.innerHTML = "<p>Bestelling kon niet worden geladen.</p>";
  }
})();
</script>
</body>
</html>
